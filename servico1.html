<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Decoração de Casamentos | Vice Glow Events</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark">
  <div class="container">
    <a class="navbar-brand" href="index.html"><img src="assets/img/logo/logo.png" alt="Vice Glow Events"></a>
    <a class="btn btn-outline-light" href="index.html">Voltar</a>
  </div>
</nav>

<main class="section">
  <div class="container">
    <h1>Decoração de Casamentos</h1>
    <p class="lead">Projetos de decoração para cerimônia e recepção, com flores, mobiliário e iluminação.</p>
    <p><strong>Preço:</strong> A partir de US$ 2.500</p>
    <p><strong>Atendimento:</strong> segunda a sábado, das 9h às 19h.</p>

    <div class="row g-4 my-4">
      <div class="col-md-6"><img src="assets/img/servicos/casamento.png" class="service-photo" alt="Decoração de Casamentos"></div>
      <div class="col-md-6"><img src="assets/img/servicos/decoracao-casamento.png" class="service-photo" alt="Decoração de Casamentos"></div>
    </div>

    <h2 class="h4 mt-5">Vídeo relacionado</h2>
    <iframe class="video-frame" src="https://www.youtube.com/embed/EaHtrEGFHV8" title="Vídeo sobre Decoração de Casamentos" allowfullscreen></iframe>

    <button class="btn btn-primary mt-4" data-bs-toggle="modal" data-bs-target="#orcamento">Orçamento</button>
  </div>
</main>

<div class="modal fade" id="orcamento" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title h5">Solicitar orçamento</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form>
          <div class="row g-3">
            <div class="col-md-6"><label class="form-label">Nome</label><input class="form-control" type="text"></div>
            <div class="col-md-6"><label class="form-label">E-mail</label><input class="form-control" type="email"></div>
            <div class="col-md-6"><label class="form-label">Telefone</label><input class="form-control" type="text"></div>
            <div class="col-md-6"><label class="form-label">Endereço</label><input class="form-control" type="text"></div>
            <div class="col-md-8"><label class="form-label">Cidade</label><input class="form-control" type="text"></div>
            <div class="col-md-4"><label class="form-label">UF</label><input class="form-control" type="text"></div>
            <div class="col-md-6"><label class="form-label">Data desejada</label><input class="form-control" type="date"></div>
            <div class="col-12"><label class="form-label">Observações</label><textarea class="form-control" rows="4"></textarea></div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
        <button type="button" class="btn btn-primary">Enviar</button>
      </div>
    </div>
  </div>
</div>

<footer class="py-4"><div class="container text-center">Desenvolvido por <strong>Vinycius Taglian Rodrigues</strong></div></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
